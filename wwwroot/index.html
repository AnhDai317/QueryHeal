<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QueryHeal - Green Computing Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --text-color: #c9d1d9;
            --neon-green: #39d353;
            --danger-red: #f85149;
            --warning-yellow: #d29922;
            --card-bg: #161b22;
            --border-color: #30363d;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
        }

        .header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        .header h1 {
            color: var(--neon-green);
            margin: 0 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .co2-counter {
            font-size: 3rem;
            font-weight: bold;
            color: var(--neon-green);
            text-shadow: 0 0 10px rgba(57, 211, 83, 0.5);
        }

        .co2-label {
            font-size: 1rem;
            color: #8b949e;
            text-transform: uppercase;
        }

        .feed-container {
            max-width: 900px;
            margin: 0 auto;
        }

        .feed-title {
            color: #8b949e;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .alert-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--danger-red);
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            animation: slideIn 0.3s ease-out forwards;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .alert-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .alert-time {
            color: #8b949e;
            font-size: 0.9em;
        }

        .alert-table {
            color: var(--danger-red);
        }

        .alert-fix {
            background-color: #010409;
            padding: 10px;
            border-radius: 4px;
            color: var(--text-color);
            margin: 10px 0;
            border: 1px solid var(--border-color);
        }

        .alert-fix span {
            color: #58a6ff;
        }

        .alert-impact {
            color: var(--neon-green);
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: var(--neon-green);
            border-radius: 50%;
            margin-right: 10px;
            box-shadow: 0 0 8px var(--neon-green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; box-shadow: 0 0 8px var(--neon-green); }
            50% { opacity: 0.5; box-shadow: 0 0 2px var(--neon-green); }
            100% { opacity: 1; box-shadow: 0 0 8px var(--neon-green); }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1><span class="status-indicator"></span>QueryHeal Sentinel</h1>
        <div class="co2-counter" id="totalCo2">0.00</div>
        <div class="co2-label">Total Potential CO2 Saved (g)</div>
    </div>

    <div class="feed-container">
        <div class="feed-title">LIVE N+1 ANOMALY FEED</div>
        <div id="alertsContainer">
            <!-- Alerts will be injected here -->
            <div style="color: #8b949e; text-align: center; padding: 20px; font-style: italic;" id="emptyState">
                Waiting for anomalies...
            </div>
        </div>
    </div>

    <script>
        let totalCo2Saved = 0;
        const totalCo2Element = document.getElementById('totalCo2');
        const alertsContainer = document.getElementById('alertsContainer');
        const emptyState = document.getElementById('emptyState');

        const connection = new signalR.HubConnectionBuilder()
            .withUrl("/queryhealhub")
            .withAutomaticReconnect()
            .build();

        connection.on("ReceiveAnomaly", (data) => {
            if (emptyState) {
                emptyState.style.display = 'none';
            }

            // Update Counter
            totalCo2Saved += data.wastedCarbonGrams;
            totalCo2Element.innerText = totalCo2Saved.toFixed(2);

            // Create Alert Card
            const card = document.createElement('div');
            card.className = 'alert-card';
            
            card.innerHTML = `
                <div class="alert-header">
                    <span class="alert-table">🚨 N+1 Detected on '${data.tableName}'</span>
                    <span class="alert-time">${data.timestamp}</span>
                </div>
                <div style="color: var(--warning-yellow); margin-bottom: 10px;">
                    ↳ Entity accessed inside a loop.
                </div>
                <div class="alert-fix">
                    <span>💡 Suggested Fix:</span><br/>
                    ${data.suggestedFix}
                </div>
                <div class="alert-impact">
                    🌱 Impact: ~${data.wastedCpuMs.toFixed(0)}ms CPU latency | ${data.wastedCarbonGrams.toFixed(2)}g CO2e wasted
                </div>
            `;

            // Prepend to show newest at top
            alertsContainer.insertBefore(card, alertsContainer.firstChild);
        });

        async function start() {
            try {
                await connection.start();
                console.log("SignalR Connected.");
            } catch (err) {
                console.log(err);
                setTimeout(start, 5000);
            }
        };

        connection.onclose(async () => {
            await start();
        });

        start();
    </script>
</body>
</html>
